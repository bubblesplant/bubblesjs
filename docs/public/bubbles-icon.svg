<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B5AEF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9D93E8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main bubble -->
  <circle cx="16" cy="16" r="14" fill="url(#iconGrad)"/>
  <circle cx="16" cy="16" r="14" fill="none" stroke="#9D93E8" stroke-width="1" opacity="0.6"/>

  <!-- Highlight -->
  <ellipse cx="11" cy="11" rx="4" ry="2.5" fill="white" opacity="0.35" transform="rotate(-45 11 11)"/>

  <!-- Small bubble -->
  <circle cx="25" cy="7" r="5" fill="#DDD9F9" opacity="0.8"/>
  <circle cx="25" cy="7" r="5" fill="none" stroke="#B5AEF0" stroke-width="0.5" opacity="0.5"/>

  <!-- Highlight on small bubble -->
  <ellipse cx="24" cy="6" rx="1.5" ry="1" fill="white" opacity="0.4" transform="rotate(-45 24 6)"/>
</svg>