packages:
  - 'packages/*'
  - docs

catalogMode: prefer

allowBuilds:
  '@parcel/watcher': true

# 上游精确锁定旧版本；在同一主版本内应用已发布的安全修复。
overrides:
  'oxfmt@0.35.0>tinypool': ^2.2.0
  'vue-element-plus-x@1.3.98>mermaid': ^11.17.2
  'lodash-es@<4.18.1': ^4.18.1

catalog:
  '@element-plus/icons-vue': ^2.3.2
  '@flatten-js/interval-tree': ^2.0.3
  '@types/node': ^26.6.6
  '@unocss/cli': ^66.12.0
  '@unocss/postcss': ^66.12.0
  '@unocss/preset-attributify': ^66.12.0
  '@unocss/preset-wind3': ^66.12.0
  '@vitejs/plugin-vue': ^6.0.10
  '@vueuse/core': ^15.0.0
  bumpp: ^12.3.0
  dayjs: ^1.11.23
  element-plus: ^2.14.7
  es-toolkit: ^1.53.1
  grapheme-splitter: ^1.0.4
  nanoid: ^6.0.2
  sass: ^1.107.1
  swiper: ^14.4.0
  typescript: ^6.0.3
  unocss: ^66.12.0
  unplugin-vue: ^8.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: ^5.0.5
  '@vitest/browser-playwright': ^5.0.5
  eslint: ^10.14.0
  '@antfu/eslint-config': ^10.0.0
  eslint-plugin-format: ^2.0.1
  '@unocss/eslint-plugin': ^66.12.0
  playwright: ^1.64.1
  vitest-browser-vue: ^3.1.0
  vue: ^3.5.44
  vue-element-plus-x: ^1.3.98
  vue-tsc: ^3.3.14
  '@types/cross-spawn': ^6.0.6

minimumReleaseAgeExclude:
  - '@vitest/browser-playwright@5.0.4'
  - '@vitest/browser@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/pretty-format@5.0.4'
  - '@vitest/spy@5.0.4'
  - '@vitest/ui@5.0.4'
  - '@vitest/utils@5.0.4'
  - vitest@5.0.4
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
  - vite-plus@1.4.0
