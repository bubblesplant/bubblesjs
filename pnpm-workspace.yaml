packages:
  - 'packages/*'
  - doc
  - docs

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  msw: true
  vue-demi: true

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - postcss
    - search-insights

packageExtensions:
  sass-embedded:
    peerDependencies:
      source-map-js: '*'
    peerDependenciesMeta:
      source-map-js:
        optional: true

catalog:
  vue: ^3.5.24

minimumReleaseAgeExclude:
  - '@rspress/core@2.0.14'
  - '@rspress/shared@2.0.14'
