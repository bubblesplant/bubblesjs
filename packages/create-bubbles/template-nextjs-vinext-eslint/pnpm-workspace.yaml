minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vinext@1.4.5
  - antd@6.7.0
  - gsap@3.15.1
  - '@eslint-react/ast@5.30.2'
  - '@eslint-react/core@5.30.2'
  - '@eslint-react/eslint-plugin@5.30.2'
  - '@eslint-react/eslint@5.30.2'
  - '@eslint-react/jsx@5.30.2'
  - '@eslint-react/shared@5.30.2'
  - '@eslint-react/var@5.30.2'
  - eslint-plugin-react-dom@5.30.2
  - eslint-plugin-react-jsx@5.30.2
  - eslint-plugin-react-naming-convention@5.30.2
  - eslint-plugin-react-rsc@5.30.2
  - eslint-plugin-react-web-api@5.30.2
  - eslint-plugin-react-x@5.30.2
  - vite@8.3.8

trustPolicy: no-downgrade

# Babel 7 requires this legacy release; its npm integrity matches the existing lockfile.
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

overrides:
  oxfmt@0.35.0>tinypool: ^2.2.0

allowBuilds:
  esbuild: true
  lefthook: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
