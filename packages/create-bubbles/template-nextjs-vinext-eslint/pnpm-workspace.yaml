minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vinext@1.4.1

trustPolicy: no-downgrade

# Babel 7 requires this legacy release; its npm integrity matches the existing lockfile.
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

overrides:
  oxfmt@0.35.0>tinypool: ^2.2.0

allowBuilds:
  esbuild: true
  lefthook: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
