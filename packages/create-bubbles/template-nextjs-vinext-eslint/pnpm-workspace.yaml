minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vinext@1.4.3
  - '@next/env@16.4.5'
  - '@next/eslint-plugin-next@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - antd@6.7.0
  - gsap@3.15.1
  - next@16.4.5

trustPolicy: no-downgrade

# Babel 7 requires this legacy release; its npm integrity matches the existing lockfile.
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

overrides:
  oxfmt@0.35.0>tinypool: ^2.2.0

allowBuilds:
  esbuild: true
  lefthook: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
