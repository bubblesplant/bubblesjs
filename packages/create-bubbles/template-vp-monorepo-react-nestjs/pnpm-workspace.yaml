allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  # 部分工具仍通过可选 peer 引入 SWC；仅允许其安装脚本，Nest 构建使用 Rspack。
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
