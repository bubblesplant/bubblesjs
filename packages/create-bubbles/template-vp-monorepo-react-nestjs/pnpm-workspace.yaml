packages:
  - apps/*
  - packages/*
  - packages/i18n/*

catalogMode: prefer

overrides:
  # ioredis 适配包允许 Terminus 11/12；固定 Nest 12 兼容版，避免旧锁文件保留 11。
  '@nestjs-modules/ioredis>@nestjs/terminus': 12.1.0
  oxfmt@0.35.0>tinypool: ^2.2.0

catalog:
  '@alova/adapter-axios': ^2.0.20
  '@ant-design/cssinjs': ^2.1.2
  '@ant-design/icons': ^6.3.4
  # 最新 beta 支持 Ant Design 6；latest 标签仍是仅支持 Ant Design 4/5 的 2.x。
  '@ant-design/pro-components': 3.1.15-9
  '@antdv-next/auto-import-resolver': ^1.2.0
  '@antdv-next/icons': ^1.1.2
  '@antfu/eslint-config': ^10.0.0
  '@aws-sdk/client-s3': ^3.1161.0
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@fastify/cookie': ^11.1.5
  '@fastify/static': ^10.1.8
  '@nestjs-modules/ioredis': ^2.3.1
  '@nestjs/bullmq': ^12.0.0
  # Nest 12 原生 Standard Schema 请求校验、响应序列化与 Swagger。
  '@nestjs/cli': 12.0.11
  '@nestjs/common': 12.3.2
  '@nestjs/config': ^12.0.1
  '@nestjs/core': 12.3.2
