  vue: ^3.5.39
  zod: ^4.4.3
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - axios@1.18.1
  - '@types/pg@8.21.0'
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: false
