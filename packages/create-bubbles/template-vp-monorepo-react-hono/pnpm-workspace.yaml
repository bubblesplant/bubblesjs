  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.1.0
  '@hono/node-server': ^1.19.14
  '@tailwindcss/vite': ^4.3.1
  '@types/bun': ^1.3.14
  '@types/node': ^26.1.1
  '@types/pg': ^8.21.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.2
  alova: ^3.5.1
  antd: ^6.4.5
  axios: ^1.18.1
  bullmq: ^6.0.9
  classnames: ^2.5.1
  dayjs: ^1.11.21
  dotenv: ^17.4.2
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  hono: ^4.12.25
  ioredis: ^5.11.1
  pg: ^8.22.0
  react: ^19.2.7
  react-dom: ^19.2.7
  react-router: ^8.0.1
  tailwindcss: ^4.3.1
  tsx: ^4.23.1
  typescript: ^6
  unplugin-auto-import: ^21.0.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
